<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade 11 - Retângulo</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 50px;
        background: white;
        color: #333;
      }
      .box {
        max-width: 300px;
        margin: auto;
        text-align: left;
      }
      h2 {
        font-weight: normal;
        margin-bottom: 25px;
      }
      input {
        display: block;
        width: 100%;
        padding: 10px 0;
        margin-bottom: 20px;
        border: none;
        border-bottom: 1px solid #ccc;
        outline: none;
      }
      button {
        background: none;
        border: 1px solid #333;
        padding: 8px 15px;
        cursor: pointer;
        margin-right: 5px;
        border-radius: 4px;
      }
      button:hover {
        background: #f9f9f9;
      }
      #outputDiv {
        margin-top: 30px;
        border-top: 1px solid #eee;
        padding-top: 20px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Retângulo</h2>

      <input
        id="baseInput"
        type="text"
        placeholder="Insira a BASE do retângulo..."
      />
      <input
        id="alturaInput"
        type="text"
        placeholder="Insira a ALTURA do retângulo..."
      />

      <button id="botaoEnviar">Calcular</button>
      <button id="botaoLimpar">Limpar</button>

      <div id="outputDiv"></div>
    </div>

    <div class="box">
      <a href="ex2.html">
        <button>Ir para a tarefa 2</button>
      </a>
    </div>

    <script src="ex1.js"></script>
  </body>
</html>
